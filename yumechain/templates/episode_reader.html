{% if story_found %}
<div
  class="episode-reader"
  style="max-width: 800px; margin: 0 auto; padding: 2rem"
>
  <!-- loading indicator を追加 -->
  <div id="loading-indicator" class="htmx-indicator loading">
    <div class="spinner"></div>
    <div>読み込み中...</div>
  </div>

  <div class="reader-header" style="margin-bottom: 2rem">
    <div
      class="navigation"
      style="display: flex; gap: 1rem; margin-bottom: 1.5rem"
    >
      <button
        class="btn btn-outline"
        hx-get="/novel/{{ novel_title }}"
        hx-target="#main-content"
      >
        ← エピソード一覧
      </button>
      <button class="btn btn-outline" onclick="location.reload()">
        🏠 ホーム
      </button>
    </div>
    <div class="episode-header">
      <h1
        style="
          font-size: 2rem;
          color: var(--secondary-color);
          margin-bottom: 0.5rem;
          line-height: 1.3;
        "
      >
        {{ story.title }}
      </h1>
      <div
        class="episode-meta"
        style="
          display: flex;
          gap: 1rem;
          color: var(--text-secondary);
          font-size: 0.9rem;
          padding: 1rem 0;
          border-bottom: 1px solid #e9ecef;
        "
      >
        <span
          style="
            padding: 0.25rem 0.75rem;
            background: #f8f9fa;
            border-radius: 15px;
          "
        >
          📂 {{ story.arc }}
        </span>
        <span
          style="
            padding: 0.25rem 0.75rem;
            background: #f8f9fa;
            border-radius: 15px;
          "
        >
          📖 第{{ story.episode }}話
        </span>
        <span
          style="
            padding: 0.25rem 0.75rem;
            background: #f8f9fa;
            border-radius: 15px;
          "
        >
          📅 {{ story.date }}
        </span>
      </div>
    </div>
  </div>

  <div
    class="story-content"
    style="
      font-family: 'Georgia', 'Times New Roman', serif;
      font-size: 1.1rem;
      line-height: 1.8;
      color: #333;
      margin: 3rem 0;
      text-align: justify;
    "
  >
    {{ story.html_content | safe }}
  </div>

  <div
    class="episode-navigation"
    style="
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 3rem;
      padding-top: 2rem;
      border-top: 2px solid #e9ecef;
    "
  >
    <div class="nav-left">
      {% if prev_story %}
      <button
        class="btn btn-primary"
        style="
          max-width: 300px;
          white-space: nowrap;
          overflow: hidden;
          text-overflow: ellipsis;
        "
        hx-get="/novel/{{ novel_title }}/episode/{{ prev_story.slug }}"
        hx-target="#main-content"
        hx-indicator="#loading-indicator"
      >
        ← {{ prev_story.title }}
      </button>
      {% else %}
      <div></div>
      {% endif %}
    </div>
    <div class="nav-right">
      {% if next_story %}
      <button
        class="btn btn-primary"
        style="
          max-width: 300px;
          white-space: nowrap;
          overflow: hidden;
          text-overflow: ellipsis;
        "
        hx-get="/novel/{{ novel_title }}/episode/{{ next_story.slug }}"
        hx-target="#main-content"
        hx-indicator="#loading-indicator"
      >
        {{ next_story.title }} →
      </button>
      {% else %}
      <div></div>
      {% endif %}
    </div>
  </div>
</div>
{% else %}
<div class="error-message">エピソードが見つかりません</div>
{% endif %}
